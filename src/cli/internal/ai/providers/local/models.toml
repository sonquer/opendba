# The models this program will download, and what is known about each of them.
#
# Every entry is Apache-2.0 or MIT and ungated on the Hub, so that a download
# needs no account and agreeing to run one needs no lawyer. The byte counts are
# measured rather than derived: a k-quant is not its nominal width, the Gemma 4
# edge variants do not have a footprint that follows from a parameter count at
# all, and an MXFP4 mixture of experts is the whole mixture on disk however
# little of it is computed per token.
#
# The revision pins a commit. A model that changed under the same name is a
# different model, and a checksum that no longer matches should stop a download
# rather than be worked around.

