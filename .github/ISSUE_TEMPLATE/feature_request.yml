name: Feature request
description: Suggest something TUI4DB should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that TUI4DB makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require TUI4DB to write to a database on its own.
