name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze go
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - name: Build both modules
        run: |
          go build ./src/cli/...
          go build ./src/tools/...

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
