name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Verify the tag matches VERSION
        run: go run ./src/tools/cmd/dev version --check "$GITHUB_REF_NAME"

      - name: Run every gate
        run: go run ./src/tools/cmd/dev check --ci --summary "$GITHUB_STEP_SUMMARY"

      - name: Install the SBOM generator goreleaser expects
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest everything the release publishes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
